worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Re-resolve after a backend container is replaced, not only at Nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location ~ ^/(api/|ws$|v3/api-docs|swagger-ui|actuator/health) {
            set $backend http://backend:8080;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host backend:8080;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Preserve Origin and Idempotency-Key; Spring validates the real browser Origin.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

