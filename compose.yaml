# Default: PostgreSQL/Kafka only. Enable application services with --profile full.
services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vortex}
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex-local}
    ports:
      - "127.0.0.1:${VORTEX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s

  kafka:
    hostname: kafka
    ports:
      - "127.0.0.1:${VORTEX_KAFKA_PORT:-9092}:9092"
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,HOST://:9092,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${VORTEX_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # The upstream image declares a secrets VOLUME; no secrets are used here.
    tmpfs:
      - /etc/kafka/secrets:uid=1000,gid=1000,mode=0755
      - /mnt/shared/config:uid=1000,gid=1000,mode=0755
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20
    mem_limit: 1024m
    cpus: 1
    stop_grace_period: 60s

  kafka-init:
    profiles: [full]
    image: apache/kafka:4.3.1
    restart: 'on-failure:3'
    depends_on:
      kafka:
        condition: service_healthy
    configs:
      - source: topic-init
        target: /opt/vortex/init-topics.sh
    # This CLI-only job needs no durable data or anonymous upstream-image volumes.
    tmpfs:
      - /etc/kafka/secrets:uid=1000,gid=1000,mode=0755
      - /mnt/shared/config:uid=1000,gid=1000,mode=0755
      - /var/lib/kafka/data:uid=1000,gid=1000,mode=0755
    entrypoint: [/bin/bash, /opt/vortex/init-topics.sh]
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx256m
    mem_limit: 512m
    cpus: 1

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vortex}?currentSchema=vortex
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      VORTEX_CORS_ORIGIN: http://localhost:${VORTEX_HTTP_PORT:-8088},http://127.0.0.1:${VORTEX_HTTP_PORT:-8088}
      VORTEX_STOMP_ORIGIN: http://localhost:${VORTEX_HTTP_PORT:-8088},http://127.0.0.1:${VORTEX_HTTP_PORT:-8088}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    mem_limit: 1024m
    cpus: 1
    stop_grace_period: 30s

  simulator:
    profiles: [full]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VORTEX_COMMAND_JOURNAL: /var/lib/vortex/journal/commands.jsonl
      VORTEX_SIMULATOR_DELAY_SECONDS: ${VORTEX_FULL_SIMULATOR_DELAY:-0}
      VORTEX_FAILURE_MODE: ${VORTEX_FULL_FAILURE_MODE:-SUCCESS}
    volumes:
      - simulator-journal:/var/lib/vortex/journal
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${VORTEX_HTTP_PORT:-8088}:8080'
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 10s

configs:
  topic-init:
    file: ./docker/kafka/init-topics.sh
volumes:
  postgres-data:
  kafka-data:
  simulator-journal:
